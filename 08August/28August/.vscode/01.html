<!-- 
Lists
4 types of list

1. Ordered List : Alphabet , Numeric, Roman
<ol>.................</ol>
Number : 1,2,3,4......
Small alphabet : a,b,c,d,e.......
Capital alphabet : A,B,C,D.......
Capital Roman : I, II, III, IV, V.........
Small roman : i,ii,iii,iv,v,vi..........

By default, order list will have order of number.

Only number is stored in start attribute.

.htm -> HTML4 -> does not include audio and video
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS</title>
</head>
<body>
    <h2>CARS</h2>
    <ol>
        <li>Fortuner</li>
        <li>Nexon</li>
        <li>BMW</li>
    </ol>

    <ol type="1" start="6">
        <li>Supra</li>
        <li>Bugatti</li>
        <li>Mclaren</li>
        <li>Pagani</li>
    </ol>

    <ol type="A" start="b">
        <li>Chocolate</li>
        <li>Vanilla</li>
        <li>Butter Scotch</li>
    </ol>

    <ol type="I">
        <li>Modak</li>
        <li>Puran Poli</li>
        <li>Shrikhand</li>
        <li>Gulab Jamoon</li>
    </ol>
</body>
</html>
