<!-- 
 reversed is a attributr with no value
 type, start and revesered are element specifit attribute used for <ol>
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol type="1" start="1" reversed>
        <li>Xtreme</li>
        <li>Bullet</li>
        <li>Himalayan</li>
        <li>Triumph</li>
    </ol>

    <ol type="A" start="A" reversed>
        <li>Xtreme</li>
        <li>Bullet</li>
        <li>Himalayan</li>
        <li>Triumph</li>
    </ol>
</body>
</html>
