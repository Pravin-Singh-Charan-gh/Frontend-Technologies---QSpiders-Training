<!-- 
2. Unordered List
by default list if dont use <ol> or <ul> 

Types : Disk (filled cricle), (By default)
        Circle (empty circle)
        Square (filled square)
        None
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <li>Xtreme</li>
    <li>Pulsor</li>
    <li>Raider</li>
    <li>Bullet 350</li>

    <ul> <!--By default disk  -->  
        <li>Xtreme</li>
        <li>Pulsor</li>
        <li>Raider</li>
        <li>Bullet 350</li>        
    </ul>

    <ul type="circle">
        <li>Xtreme</li>
        <li>Pulsor</li>
        <li>Raider</li>
        <li>Bullet 350</li>        
    </ul>

    <ul type="disk">
        <li>Xtreme</li>
        <li>Pulsor</li>
        <li>Raider</li>
        <li>Bullet 350</li>        
    </ul>

    <li style="margin-left: 20px;">KUCHH BHI</li>
</body>
</html>
