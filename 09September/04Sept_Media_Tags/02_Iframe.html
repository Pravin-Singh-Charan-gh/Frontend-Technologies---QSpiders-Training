<!-- 
=> iframe tag is used to add another document inside the webpage (with anchor it open in new webpage, but adds in the same page. )
   We can call it nested acchor tag
=> this is inline element
=> we can embed any other webpage into current webpage
=> we can also embed youtube video or google maps using their embed feature
-->

<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
