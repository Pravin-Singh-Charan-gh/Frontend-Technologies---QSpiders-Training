<!-- 
Forms is an HTML element which accepts the user input
                                                     
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORMS</title>
</head>
<body>
    <form action="">

        <label for="name">Name : </label>
        <input type="text" id="name" name="Name" value="Pravin">

        <br><br>

        <label for="mail">Email : </label>
        <input type="email" id="mail" name="Email" value="pravin123.com">
        <br><br>

        <label for="phone">Phone : </label>
        <input type="tel" name="Phone" id="phone" value="987654321">
        <br><br>

        <label for="pass">Password : </label>
        <input type="password" name="Password" id="pass" value="Pravin@123">
        <br><br>
        <button>SUBMIT</button>
    </form>
</body>
</html>
