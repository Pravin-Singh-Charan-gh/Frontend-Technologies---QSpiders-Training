<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froms</title>
</head>
<body>
    <form action="">
    <label for="">Date of Birth</label>
    <input type="date" name="date"><br><br>
    <input type="datetime"><br><br>
    <input type="datetime-local"><br><br>
    <input type="month"><br><br>
    <input type="month"><br><br>
    <input type="week"><br><br>

    <hr>

    <label for="">Gender : </label>
    <input type="radio" name="gender" value="female">Female
    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="others">Others<br><br>
    <hr>

    <label for="">Languages : </label>
    <input type="checkbox" name="lang" value="EN">English
    <input type="checkbox" name="lang" value="HN">Hindi
    <input type="checkbox" name="lang" value="GJ">Gujarati
    <input type="checkbox" name="lang" value="MH">Marathi
    <input type="checkbox" name="lang" value="All">All

    <button>SUBMIT</button>
    </form>

    <!-- <input type="submit"> -->

</body>
</html>
