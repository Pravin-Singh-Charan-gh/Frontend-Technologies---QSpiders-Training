<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robic's Cube</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="parent">
      <section class="face green-box">
        <section class="cell green top-left"></section>
        <section class="cell green top-mid"></section>
        <section class="cell green top-right"></section>
        <section class="cell green mid-left"></section>
        <section class="cell green mid-mid"></section>
        <section class="cell green mid-right"></section>
        <section class="cell green bottom-left"></section>
        <section class="cell green bottom-mid"></section>
        <section class="cell green bottom-right"></section>
      </section>

      <section class="face blue-box">
        <section class="cell blue top-left"></section>
        <section class="cell blue top-mid"></section>
        <section class="cell blue top-right"></section>
        <section class="cell blue mid-left"></section>
        <section class="cell blue mid-mid"></section>
        <section class="cell blue mid-right"></section>
        <section class="cell blue bottom-left"></section>
        <section class="cell blue bottom-mid"></section>
        <section class="cell blue bottom-right"></section>
      </section>

      <section class="face white-box">
        <section class="cell white top-left"></section>
        <section class="cell white top-mid"></section>
        <section class="cell white top-right"></section>
        <section class="cell white mid-left"></section>
        <section class="cell white mid-mid"></section>
        <section class="cell white mid-right"></section>
        <section class="cell white bottom-left"></section>
        <section class="cell white bottom-mid"></section>
        <section class="cell white bottom-right"></section>
      </section>

      <section class="face orange-box">
        <section class="cell orange top-left"></section>
        <section class="cell orange top-mid"></section>
        <section class="cell orange top-right"></section>
        <section class="cell orange mid-left"></section>
        <section class="cell orange mid-mid"></section>
        <section class="cell orange mid-right"></section>
        <section class="cell orange bottom-left"></section>
        <section class="cell orange bottom-mid"></section>
        <section class="cell orange bottom-right"></section>
      </section>

      <section class="face red-box">
        <section class="cell red top-left"></section>
        <section class="cell red top-mid"></section>
        <section class="cell red top-right"></section>
        <section class="cell red mid-left"></section>
        <section class="cell red mid-mid"></section>
        <section class="cell red mid-right"></section>
        <section class="cell red bottom-left"></section>
        <section class="cell red bottom-mid"></section>
        <section class="cell red bottom-right"></section>
      </section>

      <section class="face yellow-box">
        <section class="cell yellow top-left"></section>
        <section class="cell yellow top-mid"></section>
        <section class="cell yellow top-right"></section>
        <section class="cell yellow mid-left"></section>
        <section class="cell yellow mid-mid"></section>
        <section class="cell yellow mid-right"></section>
        <section class="cell yellow bottom-left"></section>
        <section class="cell yellow bottom-mid"></section>
        <section class="cell yellow bottom-right"></section>
      </section>
    </div>
  </body>
</html>
