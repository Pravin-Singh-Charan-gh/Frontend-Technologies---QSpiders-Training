<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript</title>
  </head>
  <body>
    <script>
      // VAR
      console.log("Hello JS");

      var a; // declaration
      console.log(a);

      a = 100; // Initialization
      console.log(a);

      var a; // re delcaration
      console.log(a); // gives 100

      a = "Pune"; // re-initialization
      console.log(a);

      // LET

      let x; // declaration
      console.log(x); //undefined
      x = 10879; // initialization
      console.log(x);

      // let x           ------ GIVES ERROR
      x = 9; // re initialization


    //   CONST
    const PI = 3.14
    console.log(PI)

    // PI = 4.14

    // const PI = 4.32

    
    </script>
  </body>
