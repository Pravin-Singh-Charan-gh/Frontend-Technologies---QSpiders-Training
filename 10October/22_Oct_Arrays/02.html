<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            margin: 0;padding: 0;box-sizing: border-box;
        }
        .navbar{
            
        }
    </style>
    <title>JS filter()</title>
</head>
<body>
    <nav class="navbar">
        <div class="top-nav">
            <div class="logo">MY.SCRIPT</div>
        </div>
        <div class="bottom-nav">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>

            </ul>
        </div>
    </nav>


    <script>


        let nums = [10,20,33,23,40,50]
        let res = nums.filter((n)=>{
            return n%2==0
        })
        console.log(nums)
        console.log(res)

        let arr = [10,11,12,13,14,15,16]
        let ans = arr.filter((n)=>!(n%2))
        console.log(ans)

    </script>
</body>
