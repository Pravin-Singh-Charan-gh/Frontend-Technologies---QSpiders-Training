<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<title>Profile Card</title>
</head>
<body>

	<div class="form-container">
        <h3>Profile Card Generator</h3>
        <form class="user-form" id="user-form">
        
		    <label for="name">NAME<span class="required">*</span></label>
		    <input type="text" id="name">

		    <label for="email">EMAIL<span class="required">*</span></label>
		    <input type="email" id="email"> 
            
            <label for="prof">PROFESSION<span class="required">*</span></label>
            <input type="text"  id="prof">
            
            <label for="image">PROFILE IMAGE URL<span class="required">*</span></label>
            <input type="url"  id="image">
            
            <label for="bio">SHORT BIO<span class="required">*</span></label>
            <textarea name="bio" id="bio" ></textarea>

            <input type="button" id="submit" value="Add Profile">
	    </form>
    </div>

	<div class="profiles-container" id="all-profiles">

	</div>
	
	<script src="script.js"></script>
</body>
</html>
