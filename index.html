<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Cards CRUD</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        padding: 30px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }

      .add-btn,
      .save-btn {
        background: #2563eb;
        color: white;
      }

      .edit-btn {
        background: #16a34a;
        color: white;
      }

      .delete-btn {
        background: #dc2626;
        color: white;
      }

      .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 25px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
      }

      .card h3 {
        margin-top: 0;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        padding: 15px;
      }

      .modal-content {
        background: white;
        padding: 25px;
        width: 100%;
        max-width: 420px;
        border-radius: 10px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>My Cards</h2>

      <button class="add-btn" onclick="openAddPopup()">+ Add New Card</button>

      <div class="card-container" id="cardContainer">

      </div>

    </div>

    <!-- Add / Edit Popup -->
    <div class="modal" id="cardModal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Card</h2>

        <form id="cardForm">
          <input type="hidden" id="cardId" />

          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" required />
          </div>

          <div class="form-group">
            <label>Address</label>
            <textarea id="address" required></textarea>
          </div>

          <div class="actions">
            <button type="button" onclick="closePopup()">Cancel</button>

            <button type="submit" class="save-btn">Save Card</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // Load cards from localStorage
      let cards = JSON.parse(localStorage.getItem("myCards")) || [];

      // Save cards into localStorage
      function saveToStorage() {
        localStorage.setItem("myCards", JSON.stringify(cards));
      }

      // Display all cards
      function displayCards() {
        const container = document.getElementById("cardContainer");

        container.innerHTML = "";

        cards.forEach((card) => {
          container.innerHTML += `
            <div class="card">
                <h3>${escapeHTML(card.name)}</h3>
                <p><strong>Email:</strong> ${escapeHTML(card.email)}</p>
                <p><strong>Phone:</strong> ${escapeHTML(card.phone)}</p>
                <p><strong>Address:</strong> ${escapeHTML(card.address)}</p>
                <button class="edit-btn"
                    onclick="editCard('${card.id}')">
                    Edit
                </button>

                <button class="delete-btn"
                    onclick="deleteCard('${card.id}')">
                    Delete
                </button>
            </div>
        `;
        });
      }

      // Prevent HTML injection
      function escapeHTML(value) {
        return String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      // Open Add popup
      function openAddPopup() {
        document.getElementById("cardForm").reset();
        document.getElementById("cardId").value = "";
        document.getElementById("modalTitle").innerText = "Add New Card";
        document.getElementById("cardModal").style.display = "flex";
      }

      // Open Edit popup
      function editCard(id) {
        const card = cards.find((item) => item.id === id);

        if (!card) return;

        document.getElementById("cardId").value = card.id;
        document.getElementById("name").value = card.name;
        document.getElementById("email").value = card.email;
        document.getElementById("phone").value = card.phone;
        document.getElementById("address").value = card.address;

        document.getElementById("modalTitle").innerText = "Edit Card";

        document.getElementById("cardModal").style.display = "flex";
      }

      // Add or Update card
      document
        .getElementById("cardForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const id = document.getElementById("cardId").value;

          const cardData = {
            id: id || crypto.randomUUID(),
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: document.getElementById("address").value.trim(),
          };

          if (id) {
            // Update existing card
            cards = cards.map((card) => (card.id === id ? cardData : card));
          } else {
            // Add new card
            cards.push(cardData);
          }

          saveToStorage();

          displayCards();

          closePopup();
        });

      // Delete card
      function deleteCard(id) {
        if (confirm("Are you sure you want to delete this card?")) {
          cards = cards.filter((card) => card.id !== id);

          saveToStorage();

          displayCards();
        }
      }

      // Close popup
      function closePopup() {
        document.getElementById("cardModal").style.display = "none";
      }

      // Close when clicking outside
      document
        .getElementById("cardModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closePopup();
        });

      // Initial display
      displayCards();
    </script>
  </body>
</html>
